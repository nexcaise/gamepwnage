name: Build GamePwnage

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install NDK
        run: |
          sdkmanager "ndk;27.3.13750724"

      - name: Configure CMake
        run: |
          cmake \
            -S . \
            -B build/${{ matrix.abi }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/27.3.13750724/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DGAMEPWNAGE_BUILD_SHARED=OFF \
            -DGAMEPWNAGE_DEBUG=OFF \
            -DGAMEPWNAGE_ENABLE_SIMD=OFF

      - name: Build
        run: |
          cmake \
            --build build/${{ matrix.abi }} \
            --parallel "$(nproc)"

      - name: Locate static library
        run: |
          echo "Searching for generated static library..."
          find build/${{ matrix.abi }} \
            -type f \
            \( -name "*.a" -o -name "libgamepwnage.a" \) \
            -print

      - name: Package
        run: |
          mkdir -p output/${{ matrix.abi }}/lib

          LIB=$(find build/${{ matrix.abi }} \
            -type f \
            -name "libgamepwnage.a" \
            | head -n 1)

          if [ -z "$LIB" ]; then
            echo "ERROR: libgamepwnage.a was not generated."
            exit 1
          fi

          cp "$LIB" output/${{ matrix.abi }}/lib/

          if [ -d include ]; then
            cp -r include output/${{ matrix.abi }}/
          fi

          if [ -f LICENSE ]; then
            cp LICENSE output/${{ matrix.abi }}/
          fi

      - name: Upload static library
        uses: actions/upload-artifact@v4
        with:
          name: gamepwnage-${{ matrix.abi }}
          path: output/${{ matrix.abi }}/

  package:
    name: Package Android libraries
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Download arm64-v8a
        uses: actions/download-artifact@v4
        with:
          name: gamepwnage-arm64-v8a
          path: package/arm64-v8a

      - name: Download armeabi-v7a
        uses: actions/download-artifact@v4
        with:
          name: gamepwnage-armeabi-v7a
          path: package/armeabi-v7a

      - name: Download x86
        uses: actions/download-artifact@v4
        with:
          name: gamepwnage-x86
          path: package/x86

      - name: Download x86_64
        uses: actions/download-artifact@v4
        with:
          name: gamepwnage-x86_64
          path: package/x86_64

      - name: Create ZIP
        run: |
          cd package
          zip -r ../gamepwnage-static-android.zip .

      - name: Upload combined package
        uses: actions/upload-artifact@v4
        with:
          name: gamepwnage-static-android
          path: gamepwnage-static-android.zip