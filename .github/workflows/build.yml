name: Build Android (.a)

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_API: 24

jobs:
  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake + Android NDK)
        run: |
          cmake -S . -B build/${{ matrix.abi }} -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DGAMEPWNAGE_BUILD_SHARED=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/out/${{ matrix.abi }}"

      - name: Build
        run: cmake --build build/${{ matrix.abi }} --parallel

      - name: Install (lib + headers)
        run: cmake --install build/${{ matrix.abi }}

      - name: Verify architecture
        run: |
          LLVM_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ls -lh out/${{ matrix.abi }}/lib/libgamepwnage.a
          "$LLVM_BIN/llvm-readelf" -h out/${{ matrix.abi }}/lib/libgamepwnage.a | grep -m1 -E "Machine"

      - name: Package
        run: |
          mkdir -p dist/${{ matrix.abi }}
          cp out/${{ matrix.abi }}/lib/libgamepwnage.a dist/${{ matrix.abi }}/
          cp -r out/${{ matrix.abi }}/include dist/${{ matrix.abi }}/include
          cp LICENSE dist/${{ matrix.abi }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libgamepwnage-android-${{ matrix.abi }}
          path: dist/${{ matrix.abi }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip per ABI
        run: |
          cd artifacts
          for d in libgamepwnage-android-*; do
            (cd "$d" && zip -r "../$d.zip" .)
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
